name: SwiftSeed
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  SwiftSeed:
    type: application
    platform: iOS
    sources:
      - path: SwiftSeed
        excludes:
          - Rendering
    dependencies:
      - target: SwiftSeedRendering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmerfight.swiftseed
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftSeed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SwiftSeedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SwiftSeedUITests
    dependencies:
      - target: SwiftSeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmerfight.swiftseed.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SwiftSeed
  SwiftSeedRendering:
    type: framework
    platform: iOS
    sources:
      - SwiftSeed/Rendering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmerfight.swiftseed.rendering
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Check lint and rendering boundaries
        script: |
          set -euo pipefail
          bash "$SRCROOT/scripts/lint.sh"
          bash "$SRCROOT/scripts/check-architecture.sh"
        basedOnDependencyAnalysis: false
schemes:
  SwiftSeed:
    build:
      targets:
        SwiftSeed: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftSeedUITests
    archive:
      config: Release
