name: Scheduled UI tests

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  EXPECTED_XCODE_VERSION: "27.2"
  HOMEBREW_NO_AUTO_UPDATE: "1"

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          python3 scripts/tools.py install
      - name: Start simulator before compiling
        run: |
          device_id=$(bash scripts/prepare-test-simulator.sh "${{ matrix.device }}")
          echo "TEST_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Run core user scenarios
        run: bash scripts/test-simulator.sh "${{ matrix.device }}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.device }}
          path: build/TestResults/
          retention-days: 7
          if-no-files-found: warn
