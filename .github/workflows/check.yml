name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          brew install xcodegen swiftformat
          bash scripts/install-swiftlint.sh
      - name: Check code, architecture and formatting
        run: bash scripts/check.sh
      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- DubCub.xcodeproj

  tests:
    name: Tests (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          brew install xcodegen
          bash scripts/install-swiftlint.sh
      - name: Run core user scenarios
        run: bash scripts/test-simulator.sh "${{ matrix.device }}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.device }}
          path: build/TestResults/*.xcresult
          retention-days: 7
          if-no-files-found: warn
