name: Project checks

on:
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    needs: [lint, build, current-sdk, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful PR checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CURRENT_SDK_RESULT: ${{ needs.current-sdk.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$CURRENT_SDK_RESULT" = success
          test "$SECURITY_RESULT" = success

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install portable checks and security tools
        run: |
          ./dev setup portable
          ./dev setup security
      - name: Check workflows, Shell, Python and health behavior
        run: ./dev check portable
      - name: Scan Git history for secrets (redacted output)
        run: ./dev check secrets
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
      - name: Reject newly introduced vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned hook runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install development tools
        run: |
          ./dev setup
      - name: Check code, architecture and formatting
        run: ./dev check apple

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          ./dev setup apple
      - name: Verify Debug tests and Release device compilation
        run: ./dev build

  current-sdk:
    name: Current SDK
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      EXPECTED_XCODE_VERSION: "27.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: ./dev setup apple
      - name: Verify current SDK Debug tests and Release device compilation
        run: ./dev build
