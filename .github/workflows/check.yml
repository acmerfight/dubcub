name: Project checks

on:
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful PR checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$BUILD_RESULT" = success

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          brew install xcodegen swiftformat
          bash scripts/install-swiftlint.sh
      - name: Check code, architecture and formatting
        run: bash scripts/check.sh
      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- DubCub.xcodeproj

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development tools
        run: |
          brew install xcodegen
          bash scripts/install-swiftlint.sh
      - name: Compile for iPhone and iPad without booting a simulator
        run: bash scripts/build-simulator.sh
